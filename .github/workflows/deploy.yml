name: Deploy Flask to GitHub Pages
on:
  push:
    branches: [main]  # Se ejecuta al hacer push a main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Clona el repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # Paso 2: Instala Python y Flask
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install flask
          pip install requests

      # Paso 3: Ejecuta Flask en segundo plano y guarda el HTML estático
      - name: Generate static HTML
        run: |
          # Inicia Flask y verifica que esté listo
          nohup python app.py > flask.log 2>&1 &
          sleep 15  # Espera más tiempo (15 segundos)

          # Intenta descargar el HTML (con reintentos)
          for i in {1..3}; do
              wget --retry-connrefused --waitretry=5 --read-timeout=20 --timeout=15 -t 3 -O docs/index.html http://localhost:5000 && break
              sleep 5
          done

          # Detén Flask y muestra logs para debug
          pkill -f "python app.py"
          cat flask.log  # Muestra los logs de Flask en el Action
          
      # Paso 4: Despliega a GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs